<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Proton Mail Sorter">
    <!--
        Our own mark, not Proton's.

        Drawn rather than borrowed on purpose: this tool talks to somebody's mailbox and asks to be
        trusted with it, and a logo imitating the service it connects to is the first small dishonesty
        on that road. It shares the application's accent colour and nothing else.

        What it shows is what the tool does: an envelope whose flap has become three sorting lines,
        each shorter than the last, falling into place.
    -->
    <defs>
        <linearGradient id="pms-a" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8a6dff" />
            <stop offset="1" stop-color="#6d4aff" />
        </linearGradient>
    </defs>
    <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="url(#pms-a)" />
    <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
        <path d="M8 11.5h16" />
        <path d="M8 16h11" />
        <path d="M8 20.5h6" />
    </g>
    <circle cx="23" cy="20.5" r="2.5" fill="none" stroke="#ffffff" stroke-width="2" />
</svg>
